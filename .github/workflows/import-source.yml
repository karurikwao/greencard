name: Import Spouse Greencard Prep Source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and extract source bundle
        run: |
          set -euo pipefail
          curl -fsSL "https://files.catbox.moe/60qj16.gz" -o /tmp/spouse-greencardprep-source.tar.gz
          mkdir -p /tmp/spouse-greencardprep-source
          tar -xzf /tmp/spouse-greencardprep-source.tar.gz -C /tmp/spouse-greencardprep-source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name README.md -exec rm -rf {} +
          cp -a /tmp/spouse-greencardprep-source/. ./
          rm -f .github/workflows/import-source.yml

      - name: Commit imported source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Improve readability and NVIDIA model defaults"
          git push
