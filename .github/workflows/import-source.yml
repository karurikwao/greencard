name: Import Source Bundle

on:
  push:
    paths:
      - .github/workflows/import-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import source archive
        run: |
          set -euo pipefail
          # Codex source bundle: 2026-06-01 pricing scroll reset and card-only Stripe Checkout
          curl -fsSL "https://litter.catbox.moe/rwmnm8.gz" -o /tmp/source.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/source.tar.gz --strip-components=1 -C .
          git status --short

      - name: Commit imported source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Update app source from Codex"
          git push
